# Cloud Build config for the Framevo Remotion renderer (Cloud Run Job image).
#
# The build context MUST be the REPO ROOT — the Dockerfile bundles the composition
# + shared render math from src/ via the "@" alias. Submit from the repo root:
#
#   gcloud builds submit \
#     --config services/remotion-renderer/cloudbuild.yaml \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/REPO/remotion-renderer:TAG,_BUILD_VERSION=$(git rev-parse --short HEAD) \
#     .
#
# (`.gcloudignore` at the repo root keeps node_modules + secrets out of the context.)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/remotion-renderer/Dockerfile
      - --build-arg
      - BUILD_VERSION=${_BUILD_VERSION}
      - -t
      - ${_IMAGE}
      - .
images: ["${_IMAGE}"]
substitutions:
  _BUILD_VERSION: dev
options:
  # Multi-stage build (npm install + esbuild + Remotion webpack prebundle + Chrome
  # ensure) — give it headroom.
  machineType: E2_HIGHCPU_8
timeout: 2400s
