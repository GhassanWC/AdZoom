# Cloud Build config for the Framevo C# export API.
#
# The build context MUST be the REPO ROOT — the Dockerfile builds the Node
# render CLI which inlines shared code from src/ via the "@" alias. Submit from
# the repo root (scripts/deploy-export-api-dotnet.mjs does this):
#
#   gcloud builds submit \
#     --config services/export-api-dotnet/cloudbuild.yaml \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/REPO/export-api:TAG \
#     .
#
# (`.gcloudignore` / `.dockerignore` at the repo root keep host node_modules,
# bin/obj, and secrets out of the uploaded context.)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/export-api-dotnet/Dockerfile
      - --build-arg
      - BUILD_VERSION=${_BUILD_VERSION}
      - -t
      - ${_IMAGE}
      - .
images: ["${_IMAGE}"]
substitutions:
  # Pass the git sha at submit time: --substitutions=_BUILD_VERSION=$(git rev-parse --short HEAD)
  _BUILD_VERSION: dev
options:
  # Multi-stage build (npm install + dotnet restore/publish) — give it headroom.
  machineType: E2_HIGHCPU_8
timeout: 1800s
